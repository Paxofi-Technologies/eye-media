name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        # Same major version most cPanel hosts run.
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: eyemedia
          MARIADB_USER: eyemedia
          MARIADB_PASSWORD: eyemedia_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://eyemedia:eyemedia_ci@127.0.0.1:3306/eyemedia
      SITE_URL: http://localhost:3000
      IP_HASH_SECRET: ci-only-not-a-secret-0123456789abcdef
      SEED_ADMIN_EMAIL: admin@eyemedia.local
      SEED_ADMIN_PASSWORD: ci-only-Passw0rd!
      MEDIA_DIR: /tmp/eyetv-media
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Migrations are in sync with the schema
        run: |
          npx drizzle-kit generate --name ci-check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::src/db/schema.ts changed without a migration. Run 'npm run db:generate' and commit drizzle/."
            git status --porcelain drizzle
            exit 1
          fi
      - name: Migrate and seed
        run: npm run db:migrate && npm run db:seed
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: |
          npm start > next.log 2>&1 &
          npx --yes wait-on@8.0.3 -t 60000 http://localhost:3000/api/health
          E2E_PASSWORD="$SEED_ADMIN_PASSWORD" npm run test:e2e
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
      - name: Server log on failure
        if: failure()
        run: cat next.log || true
